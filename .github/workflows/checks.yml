name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test progress and version rules
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: npm run test:ui
      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: learning-atlas-site
          path: dist
          if-no-files-found: error
