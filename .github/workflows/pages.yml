name: Build and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test progress and version rules
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: npm run test:ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show published website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo '## Website published'
            echo
            echo "[Open the complete architecture concept](${SITE_URL})"
            echo
            echo 'Architecture, glossary, statistics, learning journey simulations and MVP roadmap are available at one URL. No additional launch is required.'
          } >> "$GITHUB_STEP_SUMMARY"
